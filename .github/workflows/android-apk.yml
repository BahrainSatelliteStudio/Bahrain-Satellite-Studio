name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_id: { required: true }
      app_name: { required: true }
      package_id: { required: true }
      version: { required: true }
      app_url: { required: true }
      logo_url: { required: false, default: "" }
      callback_url: { required: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Configure app
        env:
          APP_NAME: ${{ inputs.app_name }}
          PKG: ${{ inputs.package_id }}
          APP_URL: ${{ inputs.app_url }}
          VER: ${{ inputs.version }}
        run: |
          mkdir -p www && echo '<html></html>' > www/index.html
          cat > capacitor.config.json <<EOF
          { "appId": "$PKG", "appName": "$APP_NAME", "webDir": "www",
            "server": { "url": "$APP_URL?v=$VER", "cleartext": true, "androidScheme": "https" },
            "android": { "allowMixedContent": true } }
          EOF
          rm -f capacitor.config.ts
          bunx cap add android
          bunx cap sync android
          IFS=. read -r A B C <<< "$VER"
          CODE=$((A*10000 + B*100 + C))
          sed -i "s/versionCode .*/versionCode $CODE/; s/versionName .*/versionName \"$VER\"/" android/app/build.gradle
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#<category android:name="android.intent.category.LAUNCHER" /><category android:name="android.intent.category.LEANBACK_LAUNCHER" />#' android/app/src/main/AndroidManifest.xml
      - name: App icon
        if: ${{ inputs.logo_url != '' }}
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          curl -fsSL "${{ inputs.logo_url }}" -o logo.img
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}; dir=android/app/src/main/res/mipmap-$n
            mkdir -p $dir
            convert logo.img -resize ${s}x${s}^ -gravity center -extent ${s}x${s} $dir/ic_launcher.png
            cp $dir/ic_launcher.png $dir/ic_launcher_round.png
            convert logo.img -resize $((s*2))x$((s*2)) -gravity center -background none -extent $((s*9/4))x$((s*9/4)) $dir/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload to panel
        if: success()
        run: |
          curl -fsS -X POST "${{ inputs.callback_url }}" -H "x-build-secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -F build_id=${{ inputs.build_id }} -F status=done -F apk=@android/app/build/outputs/apk/debug/app-debug.apk
      - name: Report failure
        if: failure()
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" -H "x-build-secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -F build_id=${{ inputs.build_id }} -F status=failed -F error="GitHub build failed"
