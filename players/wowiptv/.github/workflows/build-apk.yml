name: Build APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure signing
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | tr -d '[:space:]' | base64 -d > keystore.jks
            if ! keytool -list -keystore keystore.jks -storepass "$KS_PASSWORD" -alias "$KS_ALIAS" > /dev/null 2>&1; then
              echo "::error::Invalid keystore: check ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS"
              exit 1
            fi
            echo "storeFile=keystore.jks" >> keystore.properties
            echo "storePassword=$KS_PASSWORD" >> keystore.properties
            echo "keyAlias=$KS_ALIAS" >> keystore.properties
            echo "keyPassword=$KS_KEY_PASSWORD" >> keystore.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            ./gradlew assembleRelease -PversionName="$VERSION" --no-daemon
            cp app/build/outputs/apk/release/*.apk "wowiptv-v${VERSION}.apk"
          else
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/*.apk "wowiptv-dev.apk"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: wowiptv-release-apk
          path: wowiptv-v*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" wowiptv-v*.apk --generate-notes
